  function syncPeople() {
    const wanted = new Map();
    wanted.set("reception", {
      floor: 0,
      teacher: true,
      seed: 1,
      role: "reception",
      stationary: true,
    });
    wanted.set("director", {
      floor: 1,
      teacher: true,
      seed: 2,
      role: "director",
      stationary: true,
    });
    state.candidates.forEach((v, i) =>
      wanted.set("candidate:" + v.id, { floor: 1, teacher: true, seed: i + 5, role: "candidate" }),
    );
    state.floors.forEach((f, j) => {
      f.teachers.forEach((id, i) => {
        if (!state.teachers[id].training)
          wanted.set("teacher:" + id, {
            floor: j + 2,
            teacher: true,
            seed: i + j + 3,
            role: "teacher",
          });
      });
      for (let i = 0; i < f.students; i++) {
        const key = `student:${f.id}:${f.projects}:${i}`;
        if (lift.phase !== "exiting" || lift.deliveredKey !== key)
          wanted.set(key, { floor: j + 2, teacher: false, seed: i + j * 9, role: "student" });
      }
    });
    state.newbies.forEach((n, i) => {
      if (lift.passenger?.id !== n.id || lift.phase === "pickup")
        wanted.set(n.id, {
          floor: 0,
          teacher: false,
          seed: i + 13,
          role: "newbie",
          newbie: n.id,
        });
    });
    for (const [id, p] of people) if (!wanted.has(id)) people.delete(id);
    for (const [id, info] of wanted) {
      if (!people.has(id))
        people.set(id, {
          ...info,
          x: info.stationary
            ? info.floor === 0
              ? 99
              : 113
            : 20 + ((info.seed * 37) % 160),
          dir: 1,
          wait: (info.seed % 4) * 0.4,
          target: 50 + ((info.seed * 53) % 130),
        });
      else Object.assign(people.get(id), info);
    }
  }
  function updatePeople(dt) {
    for (const p of people.values()) {
      if (p.stationary || !state.settings.motion) {
        p.moving = false;
        continue;
      }
      if (p.wait > 0) {
        p.wait -= dt;
        p.moving = false;
        continue;
      }
      p.dir = p.target > p.x ? 1 : -1;
      p.x += p.dir * 9 * dt;
      p.moving = true;
      if (Math.abs(p.x - p.target) < 1) {
        p.target = 15 + Math.random() * 174;
        p.wait = 0.8 + Math.random() * 3;
        p.moving = false;
      }
    }
  }
  function drawPeople(o) {
    for (const p of [...people.values()].sort((a, b) => a.x - b.x)) {
      const l = layouts[p.floor];
      if (!l) continue;
      const y = l.bottom + o - 6;
      if (y < 0 || y > H + 25) continue;
      drawCharacter(
        p.role || (p.teacher ? "teacher" : "student"),
        rx + p.x,
        y,
        p.seed,
        p.moving,
        p.teacher,
        p.dir,

      if (p.newbie && lift.passenger?.id !== p.newbie) {
        A.rect(ctx, rx + p.x - 5, y - 38, 11, 11, "#f7e7ae");
        A.text(ctx, "?", rx + p.x - 2, y - 36, "#6d547a");
        A.rect(ctx, rx + p.x - 1, y - 27, 3, 3, "#f7e7ae");
      }
    }
  }

  function drawMessage() {

    const l = layouts[msg.index] || layouts[0],
      o = origin();
    if (selected === msg.index) return;
    const parts = [],
      words = msg.text.toUpperCase().replaceAll("Ё", "Е").split(" ");
    let line = "";
    for (const w of words) {
      if (line.length + w.length > 29) {
        parts.push(line);
        line = w;
      } else line += (line ? " " : "") + w;
    }
    if (line) parts.push(line);
    const y = Math.max(10, Math.min(H - 40, l.bottom + o - 56));
    const x = rx + 5;
    A.rect(
      ctx,
      x - 1,
      y - 1,

  function draw(dt) {

    drawPeople(o);

    if (buildFlash && t - buildFlash.at < 1 && state.settings.motion) {
      const l = layouts[buildFlash.index];

    for (let i = particles.length - 1; i >= 0; i--) {

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 80 * dt;
      ctx.globalAlpha = Math.max(0, p.life / 1.4);
      A.rect(ctx, p.x, p.y + o, 2, 2, p.color);
      if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    drawMessage();

  // Thirty subject-specific activities share three interaction patterns.

    setBody(

  async function runRoute() {
    const g = game;
    if (!g || g.kind !== "route" || g.running || !g.program.length || g.done)
      return;
    g.running = true;
    g.pos = g.start;
    g.status = "Программа выполняется…";
    renderGame();
    for (const dir of g.program) {
      await new Promise((r) => setTimeout(r, state.settings.motion ? 220 : 30));
      if (game !== g) return;
      const next = g.pos + { left: -1, right: 1, up: -5, down: 5 }[dir];
      if (
        next < 0 ||
        next > 24 ||
        (dir === "left" && g.pos % 5 === 0) ||
        (dir === "right" && g.pos % 5 === 4) ||
        g.walls.includes(next)
      ) {
        g.pos = g.start;
        g.running = false;
        g.status = "Препятствие. Попробуйте изменить программу.";
        renderGame();
        return;
      }
      g.pos = next;
      renderGame();
    }
    g.running = false;
    g.done = g.pos === g.target;
    g.status = g.done
      ? "Маршрут пройден!"
      : "Добавьте команды, чтобы дойти до звезды. Запуск снова начнётся со старта.";
    if (g.done) {
      sound(true);
      burst(selected);
    }
    renderGame();
  }

  // Guided elevator mini-game: walk to the lift, move between floors, exit into the classroom.
  function startEscort(id) {
    const n = state.newbies.find((x) => x.id === id),
      f = n && state.floors.find((x) => x.id === n.target);
    if (!n || !f || f.ready || f.lesson > 0 || f.students >= E.capacity(f)) {
      tell("Сейчас в группе нет свободного места.", 0, true);
      return;
    }
    if (phasesBusy()) return;
    const npc = people.get(n.id);
    closeRoom();
    lift.passenger = { ...n };
    lift.phase = "escort-walk";
    lift.target = 0;
    lift.wait = 0;
    lift.held = null;
    lift.escortX = Math.max(28, Math.min(178, npc?.x ?? 132));
    lift.guideX = Math.min(190, lift.escortX + 17);
    focusFloor(0);
    syncPeople();
    updateEscortControls();
    tell("Проведите ребёнка к лифту стрелками ← и →.", 0);
    sound();
  }
  function cancelEscort() {
    const delivered = lift.phase === "escort-exiting";
    lift.passenger = null;
    lift.phase = "idle";
    lift.target = lift.level;
    lift.autoTimer = 0;
    lift.held = null;
    escortControls.hidden = true;
    syncPeople();
    tell(
      delivered
        ? "Пассажир уже на занятии."
        : "Новенький подождёт на ресепшене.",
      Math.max(0, Math.round(lift.level)),
    );
    save();
  }
  function callLift(index) {
    if (index < 0 || index >= state.floors.length + 2) return;
    if (escortPhases.has(lift.phase)) {
      tell("Во время сопровождения используйте стрелки внизу экрана.", Math.round(lift.level));
      return;
    }
    if (
      lift.phase === "pickup" ||
      lift.phase === "boarding" ||
      lift.phase === "exiting"
    ) {
      tell("Подождите посадки пассажира.", Math.round(lift.level));
      return;
    }
    if (selected !== null) closeRoom();
    lift.target = index;
    if (lift.passenger) {
      lift.phase = "ride";
      tell(`Едем на этаж ${floorNumber(index)}.`, index);
    } else {
      lift.phase = "manual";
      lift.autoTimer = 0;
    }
    sound();
  }
  function escortDestination() {
    return lift.passenger ? floorIndex(lift.passenger.target) : 0;
  }
  function beginEscortExit() {
    if (!lift.passenger || lift.phase !== "escort-lift") return;
    const dest = escortDestination();
    if (Math.abs(lift.level - dest) > 0.13) {
      tell(`Нужен этаж ${dest}. Сейчас кабина между этажами.`, Math.round(lift.level), true);
      return;
    }
    lift.level = dest;
    lift.target = dest;
    lift.phase = "escort-exiting";
    lift.wait = 0.75;
    const f = state.floors.find((x) => x.id === lift.passenger.target);
    lift.deliveredKey = f ? `student:${f.id}:${f.projects}:${f.students}` : null;
    updateEscortControls();
  }
  function applyEscortInput(dir, dt = 0.12) {
    if (!lift.passenger || !escortPhases.has(lift.phase)) return;
    if (lift.phase === "escort-walk") {
      if (dir !== "left" && dir !== "right") return;
      const sign = dir === "left" ? -1 : 1;
      lift.escortX = Math.max(3, Math.min(188, lift.escortX + sign * 52 * dt));
      lift.guideX = Math.max(12, Math.min(196, lift.escortX + (sign < 0 ? 17 : -17)));
      if (lift.escortX <= 7) {
        if (Math.abs(lift.level) <= 0.04) {
          lift.level = 0;
          lift.target = 0;
          lift.phase = "escort-boarding";
          lift.wait = 0.65;
          lift.held = null;
          tell("Заходим в лифт.", 0);
          updateEscortControls();
        } else {
          tell("Лифт уже едет на ресепшен — подождите у двери.", 0);
        }
      }
      return;
    }
    if (lift.phase === "escort-lift") {
      if (dir === "up" || dir === "down") {
        const sign = dir === "up" ? 1 : -1;
        lift.level = Math.max(
          0,
          Math.min(state.floors.length + 1, lift.level + sign * 1.05 * dt),
        );
        lift.target = lift.level;
      } else if (dir === "right") {
        beginEscortExit();
      }
    }
  }
  function updateEscortControls() {
    if (!escortControls) return;
    const active = !!lift.passenger && escortPhases.has(lift.phase);
    escortControls.hidden = !active;
    if (!active) return;
    const dest = escortDestination();
    if (lift.phase === "escort-walk") {
      escortStatus.textContent =
        `Сопровождающий и ${lift.passenger.name}: ведите к лифту стрелками ← / →.`;
    } else if (lift.phase === "escort-boarding") {
      escortStatus.textContent = "Заходим в лифт…";
    } else if (lift.phase === "escort-lift") {
      escortStatus.textContent =
        `Нужен этаж ${dest} — ${E.lab(lift.passenger.target).name}. ↑/↓ двигают лифт, → выводит ребёнка. Сейчас: ${lift.level.toFixed(1)}.`;
    } else {
      escortStatus.textContent = `Выходим на этаж ${dest} и идём в ${E.lab(lift.passenger.target).name}.`;
    }
    escortControls.querySelectorAll("[data-escort-dir]").forEach((b) => {
      const dir = b.dataset.escortDir;
      b.classList.toggle("active", lift.held === dir);
      if (lift.phase === "escort-walk")
        b.disabled = !["left", "right"].includes(dir);
      else if (lift.phase === "escort-lift")
        b.disabled = dir === "left";
      else b.disabled = true;
    });
  }
  function updateLift(dt) {
    if (lift.phase === "escort-walk") {
      const d = -lift.level;
      if (Math.abs(d) > 0.005)
        lift.level += Math.sign(d) * Math.min(Math.abs(d), dt * 1.35);
      else lift.level = 0;
      if (lift.held) applyEscortInput(lift.held, dt);
    } else if (lift.phase === "escort-boarding") {
      lift.wait -= dt;
      if (lift.wait <= 0) {
        lift.phase = "escort-lift";
        lift.wait = 0;
        lift.level = 0;
        lift.target = 0;
        tell(`Поднимите лифт на этаж ${escortDestination()} стрелкой ↑.`, 0);
        updateEscortControls();
      }
    } else if (lift.phase === "escort-lift") {
      if (lift.held) applyEscortInput(lift.held, dt);
      const py = levelBottom(lift.level) + origin() - 35;
      if (py < 74) targetCam = Math.min(maxCam(), targetCam + (74 - py));
      if (py > H - 120) targetCam = Math.max(0, targetCam - (py - (H - 120)));
    } else if (lift.phase === "escort-exiting") {
      lift.wait -= dt;
      if (lift.wait <= 0) {
        const passenger = { ...lift.passenger };
        const dest = escortDestination();
        const res = perform(
          "escort",
          { id: passenger.id, floor: passenger.target },
          false,
        );
        if (res.ok) {
          lift.passenger = null;
          lift.phase = "idle";
          lift.autoTimer = 0;
          lift.held = null;
          escortControls.hidden = true;
          syncPeople();
          const p = people.get(lift.deliveredKey);
          if (p) p.x = 12;
          tell("Готово! +25 монет, +10 знаний.", dest);
          burst(dest);
          sound(true);
          save();
        } else {
          lift.phase = "escort-lift";
          lift.wait = 0;
          tell(res.error, dest, true);
        }
        updateEscortControls();
      }
    } else if (["pickup", "ride", "auto", "manual"].includes(lift.phase)) {
      const d = lift.target - lift.level;
      if (Math.abs(d) > 0.005) {
        lift.level += Math.sign(d) * Math.min(Math.abs(d), dt * 1.3);
        if (lift.passenger) {
          const py = levelBottom(lift.level) + origin() - 35;
          if (py < 50) targetCam = Math.min(maxCam(), targetCam + (50 - py));
          if (py > H - 70) targetCam = Math.max(0, targetCam - (py - (H - 70)));
        }
      } else {
        lift.level = lift.target;
        if (lift.phase === "pickup") {
          lift.phase = "boarding";
          lift.wait = 1;
          syncPeople();
        } else if (lift.phase === "ride") {
          const dest = floorIndex(lift.passenger.target);
          if (lift.target === dest) {
            const f = state.floors.find((f) => f.id === lift.passenger.target);
            lift.deliveredKey = `student:${f.id}:${f.projects}:${f.students}`;
            const res = perform(
              "escort",
              { id: lift.passenger.id, floor: lift.passenger.target },
              false,
            );
            if (res.ok) {
              lift.phase = "exiting";
              lift.wait = 1.2;
              tell("Спасибо! +25 монет, +10 знаний.", dest);
              burst(dest);
            } else {
              lift.phase = "await";
              tell(res.error, dest, true);
            }
            syncPeople();
          } else if (lift.target === 0) {
            cancelEscort();
          } else {
            lift.phase = "wrong";
            tell(
              `Мне нужен этаж ${dest}: ${E.lab(lift.passenger.target).name}.`,
              lift.target,
            );
          }
        } else {
          lift.phase = "idle";
          lift.autoTimer = 0;
        }
      }
    } else if (lift.phase === "boarding") {
      lift.wait -= dt;
      if (lift.wait <= 0) {
        lift.phase = "await";
        const dest = floorIndex(lift.passenger.target);
        tell(`Нажмите ${dest} в шахте лифта слева.`, 0);
        focusFloor(dest);
      }
    } else if (lift.phase === "exiting") {
      lift.wait -= dt;
      if (lift.wait <= 0) {
        lift.passenger = null;
        lift.phase = "idle";
        lift.autoTimer = 0;
        syncPeople();
        const p = people.get(lift.deliveredKey);
        if (p) p.x = 12;
      }
    } else if (
      lift.phase === "idle" &&
      selected === null &&
      !state.settings.paused &&
      state.settings.motion
    ) {
      lift.autoTimer += dt;
      if (lift.autoTimer > 8) {
        lift.autoPerson = Math.floor(t) % 12;
        lift.target =
          Math.round(lift.level) === 0
            ? 1 + (Math.floor(t) % (state.floors.length + 1))
            : 0;
        lift.phase = "auto";
      }
    }
  }
  function downloadSave() {

      { type: "application/json" },

    const url = URL.createObjectURL(blob),
      a = document.createElement("a");
    a.href = url;
    a.download = "quantorium-save.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function handleAction(event) {

        break;
      case "back":
        game = null;
        confirmAction = null;
        view = "home";
        renderPanel(true);
        break;
      case "confirm": {
        const fn = confirmAction;
        confirmAction = null;
        if (fn) fn();
        break;
      }
      case "build": {
        const res = perform("build", { id: d.id }, false);
        if (!res.ok) break;
        closeRoom();
        makeLayouts();
        const i = floorIndex(d.id);
        focusFloor(i);
        buildFlash = { index: i, at: t };
        burst(i);
        tell(`${E.lab(d.id).name} открыт! Наймите преподавателя.`, i);
        createHitboxes(true);
        break;
      }
      case "hire": {
        const sel = document.getElementById("hire-" + d.id);
        if (!sel) return;
        const floor = sel.value;
        const res = perform("hire", { id: d.id, floor });
        if (res.ok) {

            p.x = 10;
            p.target = 110;
            p.wait = 0;

      }

        perform("reject", { id: d.id });
        break;
      case "train":
        perform("train", { id: d.id });
        break;
      case "move": {
        const sel = document.getElementById("move-" + d.id);
        if (sel) perform("move", { id: d.id, floor: sel.value });
        break;
      }
      case "fire":
        ask(
          "Уволить преподавателя?",
          `Уволить ${esc(state.teachers[d.id]?.name || "преподавателя")}? Его профиль исчезнет из штата.`,
          () => {
            view = "staff";
            perform("fire", { id: d.id });

        );
        break;
      case "upgrade":
        perform("upgrade", { floor: d.floor });
        break;
      case "branch":
        ask(
          "Выбрать специализацию?",
          d.value === "speed"
            ? "Занятия этого квантума будут на 25% короче. Сменить специализацию позднее нельзя."
            : "Каждый проект будет приносить ещё 45 монет. Сменить специализацию позднее нельзя.",

        break;
      case "competition":
        perform("competition", { floor: d.floor, level: Number(d.level) });
        break;
      case "joint":
        perform("joint");
        break;
      case "chapter":
        perform("claimChapter");
        break;
      case "escort":
        startEscort(d.id);
        break;
      case "setting":
        perform("settings", {
          key: d.key,
          value: d.key === "speed" ? Number(d.value) : d.value === "true",
        });
        break;
      case "export":
        downloadSave();
        break;
      case "import":
        document.getElementById("import-file").click();
        break;
      case "reload-save": {
        try {
          const next = E.validateSave(
            JSON.parse(localStorage.getItem(SAVE_KEY)),
          );
          ask(
            "Загрузить сохранение?",
            "Текущая башня будет заменена версией из браузера. При необходимости сначала скачайте текущий прогресс.",
            () => replaceState(next),
          );
        } catch (err) {
          tell("Сохранение повреждено или не найдено.", 0, true);
          setBody(
            "Сохранение недоступно",
            "<p>Файл в браузере не удалось прочитать. Можно импортировать резервный .json или начать новую башню.</p>" +
              button("Назад", "back", {}, "secondary"),
          );
        }
        break;
      }
      case "new-game":
        ask(
          "Начать заново?",
          "Весь текущий прогресс будет заменён новой башней. Чтобы сохранить его, сначала скачайте файл .json.",
          () => {
            const s = E.initialState();
            s.floors[0].students = 2;
            s.newbieClock = 65;
            replaceState(s);
            fresh = true;
            tell("Добро пожаловать! Учитель ждёт в кабинете директора.", 1);
          },
        );
        break;
      case "start-game":
        startGame(d.id);
        break;
      case "cancel-game":
        game = null;
        view = "home";
        renderPanel(true);
        break;
      case "sequence":
        if (game?.kind === "sequence" && !game.done) {
          if (index === game.progress) {
            game.progress++;
            game.status = "Верно! Что дальше?";
            sound();
            if (game.progress === 4) {
              game.done = true;
              sound(true);
              burst(selected);
            }
          } else game.status = "Сначала: " + game.task.steps[game.progress];
          renderGame();
        }
        break;
      case "pair-left":
        if (
          game?.kind === "pairs" &&
          !game.done &&
          !game.matched.includes(index)
        ) {
          game.selected = index;
          game.status = "Теперь выберите описание.";
          renderGame();
        }
        break;
      case "pair-right":
        if (
          game?.kind === "pairs" &&
          !game.done &&
          !game.matched.includes(index)
        ) {
          if (game.selected === null) game.status = "Сначала выберите понятие.";
          else if (index === game.selected) {
            game.matched.push(index);
            game.selected = null;
            game.status = "Пара найдена!";
            sound();
            if (game.matched.length === 4) {
              game.done = true;
              sound(true);
              burst(selected);
            }
          } else
            game.status = "Это описание другого понятия. Попробуйте ещё раз.";
          renderGame();
        }
        break;
      case "route-add":
        if (
          game?.kind === "route" &&
          !game.done &&
          !game.running &&
          game.program.length < 16 &&
          ["left", "right", "up", "down"].includes(d.dir)
        ) {
          game.program.push(d.dir);
          renderGame();
        }
        break;
      case "route-undo":
        if (game?.kind === "route" && !game.running) {
          game.program.pop();
          renderGame();
        }
        break;
      case "route-reset":
        if (game?.kind === "route" && !game.running) {
          game.program = [];
          game.pos = game.start;
          game.status = "Попробуйте новый маршрут.";
          renderGame();
        }
        break;
      case "route-run":
        runRoute();
        break;
      case "game-claim":
        if (game?.done) {
          const id = game.floor;
          game = null;
          view = "home";
          const res = perform("complete", { floor: id });
          if (res.ok) {
            setBody(
              "Проект завершён",
              `<div class="victory"><h2>Новое открытие!</h2><p>+${res.reward.coins} ● · +${res.reward.knowledge} ◆</p></div><p>Ученики отправились домой. Следующая группа скоро придёт.</p>${button("В квантум", "back", {}, "gold")}`,
            );
            view = "result";
          }
        }
        break;
    }
  }
  body.addEventListener("click", handleAction);
  document.getElementById("close").addEventListener("click", closeRoom);
  modalBackdrop.addEventListener("click", closeRoom);
  document.getElementById("escort-cancel").addEventListener("click", cancelEscort);
  for (const b of escortControls.querySelectorAll("[data-escort-dir]")) {
    const press = (e) => {
      if (b.disabled) return;
      e.preventDefault();
      lift.held = b.dataset.escortDir;
      applyEscortInput(lift.held, 0.11);
      updateEscortControls();
    };
    b.addEventListener("pointerdown", press);
    b.addEventListener("contextmenu", (e) => e.preventDefault());
  }
  const releaseEscortControl = () => {
    if (!lift.held) return;
    if (
      lift.phase === "escort-lift" &&
      (lift.held === "up" || lift.held === "down")
    ) {
      const nearest = Math.round(lift.level);
      if (Math.abs(lift.level - nearest) < 0.18) {
        lift.level = nearest;
        lift.target = nearest;
      }
    }
    lift.held = null;
    updateEscortControls();
  };
  window.addEventListener("pointerup", releaseEscortControl);
  window.addEventListener("pointercancel", releaseEscortControl);
  document.getElementById("back").addEventListener("click", () => {
    game = null;
    confirmAction = null;
    view = "home";
    renderPanel(true);
  });
  document
    .getElementById("import-file")
    .addEventListener("change", async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      try {
        if (file.size > 1e6) throw Error("Файл слишком большой");
        const next = E.validateSave(JSON.parse(await file.text()));
        ask(
          "Загрузить башню?",
          `Заменить текущую башню сохранением из «${esc(file.name)}»? В файле ${next.floors.length} квантумов и ${E.totalProjects(next)} проектов.`,
          () => replaceState(next),
        );
      } catch (err) {
        if (selected === null) openRoom(0, "settings");
        setBody(
          "Не удалось загрузить",
          `<p>${esc(err.message || "Повреждённый файл")}</p><p>Текущий прогресс сохранён.</p>${button("Назад", "back", {}, "secondary")}`,
        );
        view = "import-error";
      }
    });
  function point(e) {
    const b = canvas.getBoundingClientRect();
    return { x: (e.clientX - b.left) / scale, y: (e.clientY - b.top) / scale };
  }
  function tap(p) {
    if (p.x >= tx + 4 && p.x < rx) {
      const cabY = levelBottom(lift.level) + origin();
      if (
        phasesBusy() &&
        p.y > cabY - 60 &&
        p.y < cabY &&
        ["await", "wrong"].includes(lift.phase)
      ) {
        cancelEscort();
        return;
      }
      const l = layouts.find(
        (l) =>
          l.id !== "build" &&
          p.y >= l.top + origin() &&
          p.y < l.bottom + origin(),
      );
      if (l) callLift(l.index);
      return;
    }
    if (p.x < rx || p.x > rx + RW) {
      if (selected !== null) closeRoom();
      return;
    }
    if (selected === null && !phasesBusy())
      for (const npc of people.values())
        if (npc.newbie) {
          const y = layouts[0].bottom + origin() - 6;
          if (
            Math.abs(p.x - (rx + npc.x)) < 12 &&
            p.y > y - 42 &&
            p.y < y + 3
          ) {
            openRoom(0, "visitors");
            return;
          }
        }
    const l = layouts.find(
      (l) => p.y >= l.top + origin() && p.y < l.bottom + origin(),
    );
    if (l) openRoom(l.index);
  }
  world.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".ui-overlay") || e.button > 0 || dragging) return;
    const p = point(e);
    dragging = { id: e.pointerId, y: p.y, startCam: cam, p, max: 0 };
    world.setPointerCapture(e.pointerId);
  });
  world.addEventListener("pointermove", (e) => {
    if (!dragging || dragging.id !== e.pointerId) return;
    const p = point(e),
      delta = p.y - dragging.y;
    dragging.max = Math.max(
      dragging.max,
      Math.hypot(delta, p.x - dragging.p.x),
    );
    if (dragging.max > 4) {
      targetCam = Math.max(0, Math.min(maxCam(), dragging.startCam + delta));
      cam = targetCam;
      e.preventDefault();
    }
  });
  world.addEventListener("pointerup", (e) => {
    if (!dragging || dragging.id !== e.pointerId) return;
    const was = dragging;
    dragging = null;
    if (world.hasPointerCapture(e.pointerId))
      world.releasePointerCapture(e.pointerId);
    if (was.max < 5) tap(point(e));
  });
  world.addEventListener("pointercancel", () => {
    dragging = null;
  });
  world.addEventListener(
    "wheel",
    (e) => {
      if (e.target.closest(".ui-overlay")) return;
      e.preventDefault();
      targetCam = Math.max(0, Math.min(maxCam(), targetCam - e.deltaY / scale));
    },
    { passive: false },
  );
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (selected !== null) closeRoom();
      else if (phasesBusy()) cancelEscort();
      return;
    }
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const directions = {
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right",
    };
    if (
      game?.kind === "route" &&
      !game.running &&
      !game.done &&
      directions[e.key]
    ) {
      e.preventDefault();
      if (game.program.length < 16) {
        game.program.push(directions[e.key]);
        renderGame();
      }
      return;
    }
    if (selected !== null) return;
    if (escortPhases.has(lift.phase) && directions[e.key]) {
      e.preventDefault();
      applyEscortInput(directions[e.key], 0.13);
      updateEscortControls();
      return;
    }
    if (
      (lift.phase === "await" || lift.phase === "wrong") &&
      /^\d$/.test(e.key)
    ) {
      callLift(Number(e.key));
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      targetCam = Math.max(
        0,
        Math.min(maxCam(), targetCam + (e.key === "ArrowUp" ? 65 : -65)),
      );
    }
  });
  window.addEventListener("resize", resize);
  window.addEventListener("pagehide", save);
  window.addEventListener("storage", (e) => {
    if (e.key !== SAVE_KEY || !e.newValue) return;
    try {
      const incoming = JSON.parse(e.newValue);
      if (incoming.savedAt > state.savedAt) {
        blockedSave = true;
        state.settings.paused = true;
        saveError =
          "Башня открыта в другой вкладке. Чтобы не потерять изменения, продолжайте там или перечитайте сохранение здесь.";
        tell(saveError, 0, true);
        if (selected === 0 && view === "settings") renderSettings(false);
      }
    } catch (err) {
      /* Ignore unrelated invalid browser data. */
    }
  });
  let hiddenAt = 0,
    hiddenPaused = false;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      save();
      hiddenAt = Date.now();
      hiddenPaused = state.settings.paused || !!game || phasesBusy();
    } else if (hiddenAt) {
      if (!hiddenPaused && !blockedSave)
        E.advance(state, Math.min(7200, (Date.now() - hiddenAt) / 1000));
      hiddenAt = 0;
      lastFrame = performance.now();
      syncPeople();
      if (selected !== null && view !== "confirm" && !game) renderPanel();
    }
  });
  function tickUI() {
    const sig = JSON.stringify([
      state.floors.map((f) => [
        f.id,
        f.students,
        f.ready,
        E.floorState(state, f),
      ]),
      state.candidates.map((c) => c.id),
      E.teacherList(state).map((t) => [t.id, !!t.training]),
      state.newbies.map((n) => n.id),
      state.competitions.length,
      !!state.joint,
      state.chapter,
    ]);
    if (sig !== lastSig) {
      lastSig = sig;
      syncPeople();
      if (
        selected !== null &&
        !game &&
        view !== "confirm" &&
        view !== "result" &&
        view !== "import-error" &&
        document.activeElement?.tagName !== "SELECT"
      )
        renderPanel();
    }
    if (selected !== null) {
      body
        .querySelectorAll("[data-count]")
        .forEach((el) => (el.textContent = num(state[el.dataset.count])));
      body
        .querySelectorAll("[data-lesson]")
        .forEach(
          (el) =>
            (el.textContent = clock(
              state.floors.find((f) => f.id === el.dataset.lesson)?.lesson || 0,
            )),
        );
      body
        .querySelectorAll("[data-training]")
        .forEach(
          (el) =>
            (el.textContent = clock(
              state.teachers[el.dataset.training]?.training?.left || 0,
            )),
        );
      body
        .querySelectorAll("[data-competition]")
        .forEach(
          (el) =>
            (el.textContent = clock(
              state.competitions.find((c) => c.floor === el.dataset.competition)
                ?.left || 0,
            )),
        );
      body
        .querySelectorAll("[data-joint]")
        .forEach((el) => (el.textContent = clock(state.joint?.left || 0)));
      body.querySelectorAll('[data-action="build"]').forEach((b) => {
        b.disabled =
          state.coins < E.floorCost(state) ||
          E.totalProjects(state) < E.lab(b.dataset.id).unlock;
      });
      body.querySelectorAll('[data-action="hire"]').forEach((b) => {
        const c = state.candidates.find((c) => c.id === b.dataset.id);
        b.disabled = !c || state.coins < c.cost;
      });
      body.querySelectorAll('[data-action="train"]').forEach((b) => {
        const teacher = state.teachers[b.dataset.id],
          f = state.floors.find((f) => f.teachers.includes(b.dataset.id));
        b.disabled =
          !teacher ||
          !!teacher.training ||
          !f ||
          teacher.skills[f.id] >= 10 ||
          state.knowledge < teacher.skills[f.id] * 30;
      });
      body.querySelectorAll('[data-action="upgrade"]').forEach((b) => {
        const f = state.floors.find((f) => f.id === b.dataset.floor),
          c = E.upgradeCost(f);
        b.disabled =
          f.level >= 3 ||
          f.ready ||
          f.lesson > 0 ||
          state.coins < c.coins ||
          state.knowledge < c.knowledge;
      });
    }
  }
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    t += dt;
    if (!document.hidden) {
      if (!state.settings.paused && !game && !phasesBusy() && !blockedSave)
        E.advance(state, dt * state.settings.speed);
      cam += (targetCam - cam) * Math.min(1, dt * 12);
      if (Math.abs(targetCam - cam) < 0.05) cam = targetCam;
      makeLayouts();
      updatePeople(dt);
      updateLift(dt);
      positionUI();
      draw(dt);
      saveAcc += dt;
      uiAcc += dt;
      if (uiAcc > 0.75) {
        uiAcc = 0;
        tickUI();
      }
      if (saveAcc > 5) {
        saveAcc = 0;
        save();
      }
    }
    requestAnimationFrame(frame);
  }
  // Read-only inspection is useful when extending the game in a browser console.
  window.QuantumTower = Object.freeze({
    version: "2.0",
    inspect: () => JSON.parse(JSON.stringify(state)),
    get lift() {
      return {
        level: lift.level,
        target: lift.target,
        phase: lift.phase,
        passenger: lift.passenger ? { ...lift.passenger } : null,
      };
    },
    get selectedRoom() {
      return selected === null ? null : roomId(selected);
    },
  });
  resize();
  syncPeople();
  createHitboxes(true);
  positionUI();
  save();
  if (saveError) tell(saveError, 0, true);
  else if (fresh)
    tell("Учитель ждёт в кабинете директора. Нажмите на комнату.", 1);
  requestAnimationFrame(frame);
})();

</script>
  </body>
</html>
