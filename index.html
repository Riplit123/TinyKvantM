:root {
  color-scheme: light;
  font-family: Consolas, "DejaVu Sans Mono", monospace;
  color: #263846;
  background: #9ed8f1;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
button,
input,
select {
  font: inherit;
}
button {
  touch-action: manipulation;
}
button:disabled {
  cursor: not-allowed;
  filter: saturate(0.3);
  opacity: 0.48;
}
button:focus-visible,
select:focus-visible {
  outline: 3px solid #fcde7d;
  outline-offset: 2px;
}
button:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: none !important;
}
#world {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  touch-action: none;
  isolation: isolate;
}
#tower {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
#hitboxes {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#hitboxes button {
  position: absolute;
  left: 0;
  top: 0;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: pointer;
  pointer-events: auto;
  color: transparent;
  box-shadow: none;
  transform: none;
}
#hitboxes button:focus-visible {
  outline: 2px dashed #fff1a8;
  outline-offset: -4px;
  background: #ffffff14;
}
#hitboxes .shaft {
  z-index: 2;
}
#modal-backdrop {
  position: absolute;
  inset: 0;
  z-index: 8;
  background: #1714218f;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
#modal-backdrop[hidden] {
  display: none;
}
#room-panel {
  position: absolute;
  z-index: 9;
  left: 50%;
  top: calc(50% + 24px);
  transform: translate(-50%, -50%);
  width: min(92vw, 620px);
  height: min(78vh, 690px);
  max-height: calc(100% - 70px);
  background: #fbf7ee;
  color: #253143;
  border: 2px solid #8ea3a3;
  border-radius: 12px;
  box-shadow:
    0 16px 48px #10131d66,
    0 3px 0 #66787c;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  touch-action: pan-y;
  font-size: 13px;
  line-height: 1.5;
  min-width: 0;
}
#room-panel[hidden] {
  display: none;
}
#room-panel header {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px;
  border-bottom: 2px solid #526579;
  background: #283b4e;
  flex-shrink: 0;
}
#panel-title {
  flex: 1;
  font-size: 12px;
  line-height: 1.3;
  margin: 0;
  color: #f6e3ad;
  font-weight: bold;
  overflow-wrap: anywhere;
}
#panel-body {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px;
  scrollbar-width: thin;
  scrollbar-color: #8a9a9a #243448;
  min-height: 0;
}
#panel-body > *:first-child {
  margin-top: 0;
}
p {
  margin: 8px 0 12px;
}
h2,
h3 {
  font-size: 14px;
  line-height: 1.4;
  margin: 12px 0 8px;
  color: #f0deab;
}
small,
.muted {
  font-size: 11px;
  color: #aebcc7;
}
.lead {
  color: #e6e6d6;
}
.micro {
  font-size: 10px;
  line-height: 1.5;
  color: #b6c3c8;
}
.empty {
  padding: 12px;
  border: 1px dashed #677a8c;
  color: #b9c7cb;
}
.btn,
select {
  display: block;
  width: 100%;
  border: 2px solid #74928a;
  background: #416a62;
  color: #fff8e4;
  padding: 9px 8px;
  min-height: 42px;
  box-shadow: 0 3px #14202e;
  text-align: center;
  line-height: 1.35;
  cursor: pointer;
  margin: 7px 0 9px;
  word-break: normal;
}
select {
  text-align: left;
  background: #263b4d;
  border-color: #657d8b;
}
.btn.secondary {
  background: #354c62;
  border-color: #70849c;
}
.btn.gold {
  background: #8a653c;
  border-color: #d2b173;
}
.btn.danger {
  background: #784b57;
  border-color: #b07a84;
}
.btn.ghost {
  background: #223143;
  border-color: #4f677a;
}
.btn.selected {
  background: #647c8e;
  border-color: #fff0b9;
}
.btn.correct {
  background: #396c54;
  border-color: #8bbc82;
  opacity: 0.8;
}
.small {
  border: 1px solid #94a09e;
  background: #476275;
  color: #fff3d3;
  padding: 0;
  min-width: 28px;
  min-height: 28px;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.row > .btn {
  flex: 1;
  min-width: 0;
}
.row .btn {
  margin-bottom: 7px;
}
.cards {
  display: grid;
  gap: 10px;
}
.card {
  border: 1px solid #607082;
  box-shadow: 0 2px #111d2e;
  padding: 10px;
  background: #28394b;
}
.card h3 {
  margin: 0 0 5px;
  color: #f7dfa6;
}
.card .btn:last-child {
  margin-bottom: 2px;
}
.label {
  font-size: 10px;
  letter-spacing: 1px;
  color: #a2bac6;
  text-transform: uppercase;
}
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin: 10px 0;
}
.stat {
  background: #142235;
  padding: 7px;
  border: 1px solid #495e72;
}
.stat b {
  display: block;
  font-size: 17px;
  color: #f0ce76;
}
.tag {
  display: inline-block;
  background: #192c3d;
  padding: 1px 5px;
  font-size: 11px;
  color: #aed3c6;
  margin: 2px 3px 2px 0;
}
.resource {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px;
  background: #182738;
  border: 1px solid #586e7c;
  color: #f0daa1;
  margin-bottom: 10px;
  font-size: 12px;
}
.resource span {
  white-space: nowrap;
}
.progress {
  height: 10px;
  background: #142239;
  border: 1px solid #698273;
  margin: 7px 0;
}
.progress i {
  display: block;
  height: 100%;
  background: #b5c775;
  max-width: 100%;
  transition: width 0.25s;
}
.status {
  border-left: 3px solid #bfaf83;
  padding: 6px 8px;
  background: #24384b;
  font-size: 12px;
  margin: 10px 0;
}
.line {
  border-top: 1px solid #536477;
  margin: 12px 0;
}
.checklist {
  list-style: none;
  margin: 8px 0;
  padding: 0;
}
.checklist li {
  padding: 4px 0;
  border-bottom: 1px solid #374e61;
}
.checklist .ok {
  color: #afd99b;
}
.pairs {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.pairs .term-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.pairs .btn {
  margin: 0;
  min-height: 48px;
  font-size: 11px;
  padding: 7px 4px;
}
.pair-answers {
  display: grid;
  gap: 5px;
  margin-top: 8px;
}
.grid-game {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  aspect-ratio: 1;
  max-width: 240px;
  margin: 10px auto;
  border: 3px solid #798da0;
  background: #263e50;
  gap: 2px;
}
.grid-cell {
  display: grid;
  place-items: center;
  background: #416073;
  font-size: 22px;
  color: #f9ebc2;
  min-width: 0;
}
.grid-cell.wall {
  background: repeating-linear-gradient(45deg, #53626f 0 4px, #323f50 4px 8px);
}
.grid-cell.bot {
  background: #417e78;
  color: #d4f4c7;
}
.grid-cell.target {
  color: #fbd877;
  background: #6c5f41;
}
.program {
  border: 1px solid #8b946f;
  padding: 7px;
  min-height: 32px;
  overflow-wrap: anywhere;
  color: #c6e4d0;
  letter-spacing: 3px;
}
.arrows {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
}
.arrows .btn {
  font-size: 22px;
  padding: 5px 0;
  min-height: 44px;
}
.victory {
  text-align: center;
  border: 2px solid #b8ad6c;
  padding: 10px;
  background: #3f5344;
}
.victory h2 {
  font-size: 19px;
  color: #f9e1a0;
}
.log-entry {
  padding: 7px 0;
  border-bottom: 1px solid #405365;
  font-size: 11px;
}

#room-panel header {
  border-bottom-color: #c9d4d2;
  background: #e5eee9;
}
#panel-title {
  color: #33465b;
}
#panel-body {
  color: #2d3a4a;
  scrollbar-color: #9aacaa #edf1ec;
}
#room-panel h2,
#room-panel h3 {
  color: #4d5f68;
}
#room-panel .muted,
#room-panel small,
#room-panel .micro {
  color: #687984;
}
#room-panel .card {
  background: #f3f2e9;
  border-color: #bdc9c5;
  box-shadow: 0 2px #d4dbd6;
}
#room-panel .card h3 {
  color: #59655f;
}
#room-panel .resource {
  background: #e9efea;
  border-color: #bac9c2;
  color: #5f5643;
}
#room-panel .stat {
  background: #edf1ed;
  border-color: #c0ceca;
}
#room-panel .status {
  background: #edf3ef;
  border-left-color: #9c9a72;
}
#room-panel .tag {
  background: #e0ece8;
  color: #38615a;
}
#room-panel .empty {
  border-color: #aebcb9;
  color: #6c797d;
}
#room-panel .line {
  border-top-color: #c8d2cf;
}
#room-panel .checklist li {
  border-bottom-color: #d9dfdb;
}
#room-panel .small {
  background: #eef4ef;
  color: #3e5660;
  border-color: #94aaa8;
}
#room-panel select {
  background: #f0f4f0;
  color: #2e3b48;
  border-color: #9cb0ad;
}
#room-panel .btn.ghost {
  background: #e8eeee;
  color: #314957;
  border-color: #a5b8b7;
}
#room-panel .btn.secondary {
  background: #607b83;
  border-color: #8fa7aa;
}
#room-panel .progress {
  background: #e1e7e3;
  border-color: #9fb0a8;
}
#room-panel .grid-game {
  background: #dce8e5;
  border-color: #91aaa9;
}
#room-panel .grid-cell {
  background: #c8dbd5;
  color: #435964;
}
#room-panel .grid-cell.wall {
  background: repeating-linear-gradient(45deg, #b8beb9 0 4px, #d7d8d2 4px 8px);
}
#room-panel .grid-cell.bot {
  background: #9fc8bc;
  color: #234a43;
}
#room-panel .grid-cell.target {
  background: #e5d6a6;
  color: #665737;
}
#room-panel .program {
  background: #f4f2e7;
  color: #37615a;
}
#resource-hud {
  position: absolute;
  z-index: 20;
  left: 0;
  right: 0;
  top: 0;
  min-height: 46px;
  padding: calc(7px + env(safe-area-inset-top)) 12px 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 8vw, 56px);
  background: #f8f4e9ee;
  border-bottom: 2px solid #9cafaa;
  box-shadow: 0 3px 0 #637c7d55;
  color: #314955;
  pointer-events: none;
  font-size: 14px;
}
#resource-hud span {
  white-space: nowrap;
}
#resource-hud b {
  color: #263b48;
  font-size: 15px;
}

#reward-layer {
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  overflow: hidden;
}
.reward-fly {
  position: absolute;
  left: 0;
  top: 0;
  min-width: 24px;
  height: 24px;
  padding: 2px 5px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font: 700 13px/1 Consolas, "DejaVu Sans Mono", monospace;
  box-shadow: 0 3px 10px #23333e55;
  transform: translate(-50%, -50%);
  animation: reward-flight .85s cubic-bezier(.22,.72,.25,1) forwards;
}
.reward-fly.coin {
  background: #f8d975;
  color: #614c21;
  border: 2px solid #c59a36;
}
.reward-fly.knowledge {
  background: #a9ded4;
  color: #24554e;
  border: 2px solid #5da89a;
}
@keyframes reward-flight {
  0% {
    left: var(--sx);
    top: var(--sy);
    opacity: 0;
    transform: translate(-50%, -50%) scale(.55);
  }
  12% { opacity: 1; }
  55% {
    left: var(--mx);
    top: var(--my);
    transform: translate(-50%, -50%) scale(1.12);
  }
  100% {
    left: var(--tx);
    top: var(--ty);
    opacity: .15;
    transform: translate(-50%, -50%) scale(.72);
  }
}
#escort-controls {
  position: absolute;
  z-index: 7;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: calc(132px + env(safe-area-inset-bottom));
  padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
  border: 0;
  border-top: 3px solid #94aaa5;
  border-radius: 0;
  background: #eef4eff8;
  color: #2b3b49;
  box-shadow: 0 -8px 24px #5b747344;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#escort-controls[hidden] {
  display: none;
}
#escort-status {
  min-height: 24px;
  margin: 0 0 5px;
  text-align: center;
  font-size: 11px;
  line-height: 1.25;
}
.escort-pad {
  display: grid;
  grid-template-columns: repeat(4, minmax(52px, 1fr));
  gap: 7px;
  width: min(94vw, 520px);
  margin: 0 auto;
}
.escort-arrow {
  min-height: 47px;
  border: 2px solid #859f9a;
  border-radius: 9px;
  background: #dce9e2;
  color: #334b54;
  box-shadow: 0 3px #8b9b96;
  font-size: 26px;
  font-weight: bold;
  cursor: pointer;
  touch-action: none;
}
.escort-arrow.active {
  background: #bfd6cc;
  transform: translateY(2px);
  box-shadow: 0 1px #8b9b96;
}
.escort-arrow:disabled {
  opacity: .3;
}

.badge-wrap {
  position: relative;
  display: block;
  width: 100%;
  margin: 7px 0 9px;
}
.badge-wrap > .btn {
  margin: 0;
}
.notify-badge {
  position: absolute;
  z-index: 3;
  top: -8px;
  right: 10px;
  min-width: 24px;
  height: 24px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  border: 2px solid #fff8eb;
  box-shadow: 0 2px 6px #26333b55;
  color: #fff;
  font-weight: 800;
  font-size: 12px;
  line-height: 1;
  pointer-events: none;
  animation: notify-pulse 1.45s ease-in-out infinite;
}
.notify-badge.red {
  background: #c94b54;
}
.notify-badge.gold {
  background: #c39432;
  color: #fff9df;
}
.notify-badge.green {
  background: #4e8b70;
}
@keyframes notify-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
.event-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(52px, 1fr));
  gap: 8px;
  max-width: 360px;
  margin: 14px auto;
}
.event-card {
  aspect-ratio: 1;
  min-height: 58px;
  border: 2px solid #829c9a;
  border-radius: 12px;
  background: #dce9e5;
  color: transparent;
  box-shadow: 0 3px #97aaa5;
  font-size: 28px;
  cursor: pointer;
  transition: transform .12s ease, background .12s ease;
}
.event-card.revealed,
.event-card.matched {
  color: #334d56;
  background: #fff2c8;
  transform: translateY(2px);
  box-shadow: 0 1px #97aaa5;
}
.event-card.matched {
  background: #cce8d9;
  border-color: #72a489;
}
.event-card:disabled {
  opacity: 1;
  filter: none;
  cursor: default;
}
.event-marquee {
  border: 2px solid #a99362;
  border-radius: 12px;
  padding: 10px;
  background:
    radial-gradient(circle at 15% 20%, #fff2a0 0 3px, transparent 4px),
    radial-gradient(circle at 82% 28%, #a8e2d3 0 3px, transparent 4px),
    radial-gradient(circle at 60% 80%, #dfb2df 0 3px, transparent 4px),
    #f5eedc;
  text-align: center;
}

/* Small home menus do not need a nearly full-screen modal. */
#room-panel.compact-menu {
  width: min(90vw, calc(355px + var(--compact-extra, 0px)));
  height: auto;
  max-height: min(72vh, calc(112px + var(--menu-items, 3) * 58px));
}
#room-panel.compact-menu #panel-body {
  padding: 12px 14px 14px;
  overflow-y: auto;
}
#room-panel.compact-menu #panel-body > .btn,
#room-panel.compact-menu #panel-body > .badge-wrap {
  margin-top: 6px;
  margin-bottom: 8px;
}
#room-panel.lesson-result {
  width: min(90vw, 420px);
  height: auto;
  max-height: min(62vh, 360px);
}
#room-panel.lesson-result #panel-body {
  padding: 14px;
  overflow-y: auto;
}
#room-panel.character-editor-panel {
  width: min(92vw, 470px);
  height: auto;
  max-height: min(72vh, 540px);
}
#room-panel.character-editor-panel #panel-body {
  padding: 14px;
  overflow-y: auto;
}
.character-editor-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
.character-editor-tabs .btn {
  margin: 0;
  min-height: 46px;
  padding: 7px 5px;
  font-size: 11px;
}
.character-editor-card {
  border: 2px solid #a99362;
  border-radius: 12px;
  padding: 12px;
  background:
    radial-gradient(circle at 12% 18%, #fff2a0 0 3px, transparent 4px),
    radial-gradient(circle at 87% 26%, #a8e2d3 0 3px, transparent 4px),
    #f5eedc;
}
.character-control {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  min-height: 48px;
  border-bottom: 1px solid #d7d0bc;
  color: #40545b;
}
.character-control:last-of-type {
  border-bottom: 0;
}
.character-control input[type="color"] {
  width: 54px;
  height: 34px;
  padding: 2px;
  border: 1px solid #9caeaa;
  border-radius: 8px;
  background: #fffaf0;
  cursor: pointer;
}
.character-control input[type="checkbox"] {
  width: 22px;
  height: 22px;
  accent-color: #4d7e8e;
}
.character-preview-note {
  margin: 10px 0 0;
  color: #687984;
  font-size: 10px;
  line-height: 1.45;
}

/* Main quantum menus and upgrade screens stay compact; only games/staff/teams may use the large modal. */
#room-panel.quantum-compact {
  width: min(92vw, 500px);
  height: auto;
  max-height: min(72vh, 560px);
}
#room-panel.quantum-compact #panel-body {
  overflow-y: auto;
  padding: 12px 14px 14px;
}
.construction-card {
  border: 2px solid #a99362;
  border-radius: 12px;
  padding: 13px;
  background:
    radial-gradient(circle at 14% 24%, #fff0a0 0 3px, transparent 4px),
    radial-gradient(circle at 86% 22%, #a8e2d3 0 3px, transparent 4px),
    #f5eedc;
  text-align: center;
}
.construction-card b {
  color: #6b552b;
  font-size: 18px;
}

/* Third conference arcade: colourful 3x3 impulse field. */
.pulse-head {

      wanted.set("candidate-wait:" + v.id, {

          wanted.set(key, { floor: j + 3, teacher: false, seed: i + j * 9, role: "student" });
      }

      if (lift.passenger?.id !== n.id || lift.phase === "pickup")

          floor: 0,
          teacher: false,
          seed: i + 13,
          role: "newbie",
          newbie: n.id,
        });
    });
    for (const [id, p] of people) if (!wanted.has(id)) people.delete(id);
    for (const [id, info] of wanted) {

  function updatePeople(dt) {
    const o = origin();
    for (const p of people.values()) {
      const l = layouts[p.floor];
      const visible = l && l.bottom + o > -100 && l.top + o < H + 100;
      if (!visible) {
        p.moving = false;
        continue;
      }
      if (p.candidateWaiting) {
        const queueTarget = Math.max(118, 155 - (p.queueIndex || 0) * 17);
        p.target = queueTarget;
        if (Math.abs(p.x - queueTarget) < 1.5) {
          p.x = queueTarget;
          p.moving = false;
          continue;
        }
      }
      if (p.stationary || !state.settings.motion) {
        p.moving = false;
        continue;
      }
      if (p.wait > 0 && !p.candidateWaiting) {
        p.wait -= dt;
        p.moving = false;
        continue;
      }
      p.dir = p.target > p.x ? 1 : -1;
      p.x += p.dir * (p.candidateWaiting ? 6 : 9) * dt;
      p.moving = true;
      if (!p.candidateWaiting && Math.abs(p.x - p.target) < 1) {
        p.target = 15 + Math.random() * 174;
        p.wait = 0.8 + Math.random() * 3;
        p.moving = false;
      }
    }

  const BLOCK_SHAPES = [

  function blockShapeBounds(shape) {

    if (!piece || piece.used) return false;

  function clearBlockLines(g) {
    const rows = [];
    const cols = [];
    for (let y = 0; y < 6; y++)
      if (Array.from({ length: 6 }, (_, x) => g.board[y * 6 + x]).every(Boolean))
        rows.push(y);
    for (let x = 0; x < 6; x++)
      if (Array.from({ length: 6 }, (_, y) => g.board[y * 6 + x]).every(Boolean))
        cols.push(x);
    const lineCount = rows.length + cols.length;
    if (!lineCount) {
      g.lastCombo = "";
      return 0;
    }
    const clearSet = new Set();
    rows.forEach((y) => {
      for (let x = 0; x < 6; x++) clearSet.add(y * 6 + x);

      for (let y = 0; y < 6; y++) clearSet.add(y * 6 + x);

    clearSet.forEach((i) => (g.board[i] = false));

    const gained = lineCount * 14 + comboBonus;

    g.score += gained;
    g.lastCombo =
      lineCount > 1
        ? `КОМБО ×${lineCount}! +${gained} очков`

  function placeBlockPiece(pieceIndex, row, col) {

    piece.cells.forEach(([dx, dy]) => {
      g.board[(row + dy) * 6 + col + dx] = true;

    piece.used = true;
    g.moves++;
    g.score += piece.cells.length * 2;
    clearBlockLines(g);

    if (g.pieces.every((p) => p.used)) g.pieces = newBlockPieces();
    if (!anyBlockMove(g)) {

  // Thirty-six subject-specific activities share three interaction patterns.
  function startGame(id) {
    const f = state.floors.find((x) => x.id === id);
    if (!f?.ready) return;
    const variant = f.projects % 3,
      task = TASKS[E.lab(id).name];

    if (order.join("") === "0123") order.reverse();

    game = {
      kind: ["sequence", "pairs", "route"][variant],
      floor: id,
      task,
      progress: 0,
      order,
      matched: [],
      selected: null,
      status: "Ошибки не уменьшают награду. Попробуйте!",
      done: false,
      program: [],
      start: odd ? 24 : 20,
      pos: odd ? 24 : 20,
      target: odd ? 0 : 4,
      walls: odd ? [6, 7, 8, 16, 17] : [7, 12, 17],
      running: false,
    };
    view = "game";
    renderGame(true);
  }
  function renderGame(reset = false) {

  async function runRoute() {
    const g = game;
    if (!g || g.kind !== "route" || g.running || !g.program.length || g.done)
      return;
    g.running = true;
    g.pos = g.start;
    g.status = "Программа выполняется…";
    renderGame();
    for (const dir of g.program) {
      await new Promise((r) => setTimeout(r, state.settings.motion ? 220 : 30));
      if (game !== g) return;
      const next = g.pos + { left: -1, right: 1, up: -5, down: 5 }[dir];
      if (
        next < 0 ||
        next > 24 ||
        (dir === "left" && g.pos % 5 === 0) ||
        (dir === "right" && g.pos % 5 === 4) ||
        g.walls.includes(next)
      ) {
        g.pos = g.start;
        g.running = false;
        g.status = "Препятствие. Попробуйте изменить программу.";
        renderGame();
        return;
      }
      g.pos = next;
      renderGame();
    }
    g.running = false;
    g.done = g.pos === g.target;
    g.status = g.done
      ? "Маршрут пройден!"
      : "Добавьте команды, чтобы дойти до звезды. Запуск снова начнётся со старта.";
    if (g.done) {
      sound(true);
      burst(selected);
    }
    renderGame();
  }

  // Guided elevator mini-game: walk to the lift, move between floors, exit into the classroom.
  function startEscort(id) {
    const n = state.newbies.find((x) => x.id === id),
      f = n && state.floors.find((x) => x.id === n.target);
    if (!n || !f || f.ready || f.lesson > 0 || f.students >= E.capacity(f)) {
      tell("Сейчас в группе нет свободного места.", 0, true);
      return;
    }
    if (phasesBusy() || candidateLiftPhases.has(lift.phase)) {
      tell("Лифт занят кандидатами. Он скоро вернётся на ресепшен.", 0);
      return;
    }
    const npc = people.get(n.id);
    const frozenAdmin = currentReceptionRole();
    closeRoom();
    lift.passenger = { ...n };
    lift.adminRole = frozenAdmin;
    lift.phase = "escort-walk";
    lift.target = 0;
    lift.wait = 0;
    lift.held = null;
    lift.escortX = Math.max(28, Math.min(178, npc?.x ?? 132));
    lift.guideX = Math.min(190, lift.escortX + 17);
    focusFloor(0);
    syncPeople();
    updateEscortControls();
    tell("Проведите ребёнка к лифту стрелками ← и →.", 0);
    sound();
  }
  function cancelEscort() {
    const delivered = lift.phase === "escort-exiting";
    lift.passenger = null;
    lift.phase = "idle";
    lift.target = lift.level;
    lift.autoTimer = 0;
    lift.held = null;
    lift.adminRole = null;
    escortControls.hidden = true;
    clampCam();
    syncPeople();
    tell(
      delivered
        ? "Пассажир уже на занятии."
        : "Новенький подождёт на ресепшене.",
      Math.max(0, Math.round(lift.level)),
    );
    save();
  }
  function callLift(index) {
    if (index < 0 || index >= state.floors.length + 3) return;
    if (escortPhases.has(lift.phase)) {
      tell("Во время сопровождения используйте стрелки внизу экрана.", Math.round(lift.level));
      return;
    }
    if (candidateLiftPhases.has(lift.phase)) {
      tell("Лифт сейчас везёт кандидатов в кабинет директора.", Math.round(lift.level));
      return;
    }
    if (
      lift.phase === "pickup" ||
      lift.phase === "boarding" ||
      lift.phase === "exiting"
    ) {
      tell("Подождите посадки пассажира.", Math.round(lift.level));
      return;
    }
    if (selected !== null) closeRoom();
    lift.target = index;
    if (lift.passenger) {
      lift.phase = "ride";
      tell(`Едем на этаж ${floorNumber(index)}.`, index);
    } else {
      lift.phase = "manual";
      lift.autoTimer = 0;
    }
    sound();
  }
  function escortDestination() {
    return lift.passenger ? floorIndex(lift.passenger.target) : 0;
  }
  function beginEscortExit() {
    if (!lift.passenger || lift.phase !== "escort-lift") return;
    const dest = escortDestination();
    if (Math.abs(lift.level - dest) > 0.13) {
      tell(`Нужен этаж ${dest}. Сейчас кабина между этажами.`, Math.round(lift.level), true);
      return;
    }
    lift.level = dest;
    lift.target = dest;
    lift.phase = "escort-exiting";
    lift.wait = 0.75;
    const f = state.floors.find((x) => x.id === lift.passenger.target);
    lift.deliveredKey = f ? `student:${f.id}:${f.projects}:${f.students}` : null;
    updateEscortControls();
  }
  function applyEscortInput(dir, dt = 0.12) {
    if (!lift.passenger || !escortPhases.has(lift.phase)) return;
    if (lift.phase === "escort-walk") {
      if (dir !== "left" && dir !== "right") return;
      const sign = dir === "left" ? -1 : 1;
      lift.escortX = Math.max(3, Math.min(188, lift.escortX + sign * 52 * dt));
      lift.guideX = Math.max(12, Math.min(196, lift.escortX + (sign < 0 ? 17 : -17)));
      if (lift.escortX <= 7) {
        if (Math.abs(lift.level) <= 0.04) {
          lift.level = 0;
          lift.target = 0;
          lift.phase = "escort-boarding";
          lift.wait = 0.65;
          lift.held = null;
          tell("Заходим в лифт.", 0);
          updateEscortControls();
        } else {
          tell("Лифт уже едет на ресепшен — подождите у двери.", 0);
        }
      }
      return;
    }
    if (lift.phase === "escort-lift") {
      if (dir === "up" || dir === "down") {
        const sign = dir === "up" ? 1 : -1;
        lift.level = Math.max(
          0,
          Math.min(state.floors.length + 2, lift.level + sign * 1.05 * dt),
        );
        lift.target = lift.level;
      } else if (dir === "right") {
        beginEscortExit();
      }
    }
  }
  function updateEscortControls() {
    if (!escortControls) return;
    const active = !!lift.passenger && escortPhases.has(lift.phase);
    escortControls.hidden = !active;
    if (!active) return;
    const dest = escortDestination();
    if (lift.phase === "escort-walk") {
      escortStatus.textContent =
        `Администратор и ${lift.passenger.name}: ведите к лифту стрелками ← / →.`;
    } else if (lift.phase === "escort-boarding") {
      escortStatus.textContent = "Заходим в лифт…";
    } else if (lift.phase === "escort-lift") {
      escortStatus.textContent =
        `Нужен этаж ${dest} — ${E.lab(lift.passenger.target).name}. ↑/↓ двигают лифт, → выводит ребёнка. Сейчас: ${lift.level.toFixed(1)}.`;
    } else {
      escortStatus.textContent = `Выходим на этаж ${dest} и идём в ${E.lab(lift.passenger.target).name}.`;
    }
    escortControls.querySelectorAll("[data-escort-dir]").forEach((b) => {
      const dir = b.dataset.escortDir;
      b.classList.toggle("active", lift.held === dir);
      if (lift.phase === "escort-walk")
        b.disabled = !["left", "right"].includes(dir);
      else if (lift.phase === "escort-lift")
        b.disabled = dir === "left";
      else b.disabled = true;
    });
  }
  function updateLift(dt) {
    if (candidateLiftPhases.has(lift.phase)) {
      if (lift.phase === "candidate-call" || lift.phase === "candidate-ride") {
        const d = lift.target - lift.level;
        if (Math.abs(d) > 0.005) {
          lift.level += Math.sign(d) * Math.min(Math.abs(d), dt * 1.35);
        } else {
          lift.level = lift.target;
          if (lift.phase === "candidate-call") {
            const free = Math.max(0, 5 - state.candidates.length);
            const count = Math.min(2, free, state.candidateQueue.length);
            if (!count) {
              lift.phase = "idle";
              lift.candidatePassengers = [];
            } else {
              lift.candidatePassengers = state.candidateQueue.slice(0, count);
              lift.phase = "candidate-boarding";
              lift.wait = 2.8;
              syncPeople();
            }
          } else {
            lift.phase = "candidate-exiting";
            lift.wait = 1.5;
          }
        }
      } else if (lift.phase === "candidate-boarding") {
        lift.wait -= dt;
        if (lift.wait <= 0) {
          lift.level = 0;
          lift.target = 1;
          lift.phase = "candidate-ride";
        }
      } else if (lift.phase === "candidate-exiting") {
        lift.wait -= dt;
        if (lift.wait <= 0) {
          const free = Math.max(0, 5 - state.candidates.length);
          const arrived = lift.candidatePassengers.slice(0, free);
          const arrivedIds = new Set(arrived.map((c) => c.id));
          state.candidates.push(...arrived);
          state.candidateQueue = state.candidateQueue.filter((c) => !arrivedIds.has(c.id));
          lift.candidatePassengers = [];
          lift.phase = "idle";
          lift.autoTimer = 0;
          syncPeople();
          save();
          if (state.candidates.length)
            tell("Кандидаты поднялись в кабинет директора.", 1);
        }
      }
    } else if (lift.phase === "escort-walk") {
      const d = -lift.level;
      if (Math.abs(d) > 0.005)
        lift.level += Math.sign(d) * Math.min(Math.abs(d), dt * 1.35);
      else lift.level = 0;
      if (lift.held) applyEscortInput(lift.held, dt);
    } else if (lift.phase === "escort-boarding") {
      lift.wait -= dt;
      if (lift.wait <= 0) {
        lift.phase = "escort-lift";
        lift.wait = 0;
        lift.level = 0;
        lift.target = 0;
        tell(`Поднимите лифт на этаж ${escortDestination()} стрелкой ↑.`, 0);
        updateEscortControls();
      }
    } else if (lift.phase === "escort-lift") {
      if (lift.held) applyEscortInput(lift.held, dt);
      const py = levelBottom(lift.level) + origin() - 35;
      if (py < 74) targetCam = Math.min(maxCam(), targetCam + (74 - py));
      if (py > H - 120) targetCam = Math.max(0, targetCam - (py - (H - 120)));
    } else if (lift.phase === "escort-exiting") {
      lift.wait -= dt;
      if (lift.wait <= 0) {
        const passenger = { ...lift.passenger };
        const dest = escortDestination();
        const res = perform(
          "escort",
          { id: passenger.id, floor: passenger.target },
          false,
        );
        if (res.ok) {
          lift.passenger = null;
          lift.phase = "idle";
          lift.autoTimer = 0;
          lift.held = null;
          lift.adminRole = null;
          escortControls.hidden = true;
          clampCam();
          syncPeople();
          const p = people.get(lift.deliveredKey);
          if (p) p.x = 12;
          tell("Готово! +25 монет, +10 знаний.", dest);
          burst(dest);
          sound(true);
          save();
        } else {
          lift.phase = "escort-lift";
          lift.wait = 0;
          tell(res.error, dest, true);
        }
        updateEscortControls();
      }
    } else if (["pickup", "ride", "auto", "manual"].includes(lift.phase)) {
      const d = lift.target - lift.level;
      if (Math.abs(d) > 0.005) {
        lift.level += Math.sign(d) * Math.min(Math.abs(d), dt * 1.3);
        if (lift.passenger) {
          const py = levelBottom(lift.level) + origin() - 35;
          if (py < 50) targetCam = Math.min(maxCam(), targetCam + (50 - py));
          if (py > H - 70) targetCam = Math.max(0, targetCam - (py - (H - 70)));
        }
      } else {
        lift.level = lift.target;
        if (lift.phase === "pickup") {
          lift.phase = "boarding";
          lift.wait = 1;
          syncPeople();
        } else if (lift.phase === "ride") {
          const dest = floorIndex(lift.passenger.target);
          if (lift.target === dest) {
            const f = state.floors.find((f) => f.id === lift.passenger.target);
            lift.deliveredKey = `student:${f.id}:${f.projects}:${f.students}`;
            const res = perform(
              "escort",
              { id: lift.passenger.id, floor: lift.passenger.target },
              false,
            );
            if (res.ok) {
              lift.phase = "exiting";
              lift.wait = 1.2;
              tell("Спасибо! +25 монет, +10 знаний.", dest);
              burst(dest);
            } else {
              lift.phase = "await";
              tell(res.error, dest, true);
            }
            syncPeople();
          } else if (lift.target === 0) {
            cancelEscort();
          } else {
            lift.phase = "wrong";
            tell(
              `Мне нужен этаж ${dest}: ${E.lab(lift.passenger.target).name}.`,
              lift.target,
            );
          }
        } else {
          lift.phase = "idle";
          lift.autoTimer = 0;
        }
      }
    } else if (lift.phase === "boarding") {
      lift.wait -= dt;

    const second = body.querySelector('[data-block-cell="1"]');
    const below = body.querySelector('[data-block-cell="6"]');
    if (!board || !piece || !first || !second || !below) return null;
    const firstRect = first.getBoundingClientRect();
    const secondRect = second.getBoundingClientRect();
    const belowRect = below.getBoundingClientRect();
    const px = e.clientX;
    const py = e.clientY - blockLiftOffset(e);
    const stepX = secondRect.left - firstRect.left;
    const stepY = belowRect.top - firstRect.top;
    const centerCol = (px - (firstRect.left + firstRect.width / 2)) / stepX;
    const centerRow = (py - (firstRect.top + firstRect.height / 2)) / stepY;
    const { cols, rows } = blockShapeBounds(piece);
    const col = Math.round(centerCol - (cols - 1) / 2);

    ghost.className = "block-drag-ghost";
    ghost.style.gridTemplateColumns = `repeat(${cols}, 20px)`;
    ghost.style.gridTemplateRows = `repeat(${rows}, 20px)`;
    for (let y = 0; y < rows; y++)
      for (let x = 0; x < cols; x++) {
        const cell = document.createElement("i");

          if (
            Math.abs(p.x - (rx + npc.x)) < 12 &&
            p.y > y - 42 &&
            p.y < y + 3
          ) {
            openRoom(0, "visitors");
            return;
          }
        }
    const l = layouts.find(
      (l) => p.y >= l.top + origin() && p.y < l.bottom + origin(),
    );
    if (l) openRoom(l.index, "home", null);
  }
  world.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".ui-overlay") || e.button > 0 || dragging) return;
    // Prevent the synthetic click from landing on a button in a modal
    // that is created by this same tap (mobile "click-through").
    e.preventDefault();
    const p = point(e);
    dragging = { id: e.pointerId, y: p.y, startCam: cam, p, max: 0 };
    try {
      world.setPointerCapture(e.pointerId);
    } catch (_) {}
  });
  world.addEventListener("pointermove", (e) => {
    if (!dragging || dragging.id !== e.pointerId) return;
    const p = point(e),
      delta = p.y - dragging.y;
    dragging.max = Math.max(
      dragging.max,
      Math.hypot(delta, p.x - dragging.p.x),
    );
    if (dragging.max > 4) {
      targetCam = Math.max(0, Math.min(maxCam(), dragging.startCam + delta));
      cam = targetCam;
      e.preventDefault();
    }
  });
  world.addEventListener("pointerup", (e) => {
    if (!dragging || dragging.id !== e.pointerId) return;
    const was = dragging;
    dragging = null;
    if (world.hasPointerCapture(e.pointerId))
      world.releasePointerCapture(e.pointerId);
    if (was.max < 5) tap(point(e));
  });
  world.addEventListener("pointercancel", () => {
    dragging = null;
  });
  world.addEventListener(
    "wheel",
    (e) => {
      if (e.target.closest(".ui-overlay")) return;
      e.preventDefault();
      targetCam = Math.max(0, Math.min(maxCam(), targetCam - e.deltaY / scale));
    },
    { passive: false },
  );
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (selected !== null) closeRoom();
      else if (phasesBusy()) cancelEscort();
      return;
    }
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const directions = {
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right",
    };
    if (
      game?.kind === "route" &&
      !game.running &&
      !game.done &&
      directions[e.key]
    ) {
      e.preventDefault();
      if (game.program.length < 16) {
        game.program.push(directions[e.key]);
        renderGame();
      }
      return;
    }
    if (selected !== null) return;
    if (escortPhases.has(lift.phase) && directions[e.key]) {
      e.preventDefault();
      applyEscortInput(directions[e.key], 0.13);
      updateEscortControls();
      return;
    }
    if (
      (lift.phase === "await" || lift.phase === "wrong") &&
      /^\d$/.test(e.key)
    ) {
      callLift(Number(e.key));
      return;
    }
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      targetCam = Math.max(
        0,
        Math.min(maxCam(), targetCam + (e.key === "ArrowUp" ? 65 : -65)),
      );
    }
  });
  window.addEventListener("resize", resize);
  window.addEventListener("pagehide", save);
  window.addEventListener("storage", (e) => {
    if (e.key !== SAVE_KEY || !e.newValue) return;
    try {
      const incoming = JSON.parse(e.newValue);
      if (incoming.savedAt > state.savedAt) {
        blockedSave = true;
        state.settings.paused = true;
        saveError =
          "Башня открыта в другой вкладке. Чтобы не потерять изменения, продолжайте там или перечитайте сохранение здесь.";
        tell(saveError, 0, true);
        if (selected === 0 && view === "settings") renderSettings(false);
      }
    } catch (err) {
      /* Ignore unrelated invalid browser data. */
    }
  });
  let hiddenAt = 0,
    hiddenPaused = false;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      save();
      hiddenAt = Date.now();
      hiddenPaused = state.settings.paused || !!game || phasesBusy();
    } else if (hiddenAt) {
      if (!hiddenPaused && !blockedSave)
        E.advance(state, Math.min(21600, (Date.now() - hiddenAt) / 1000));
      hiddenAt = 0;
      lastFrame = performance.now();
      syncPeople();
      if (selected !== null && view !== "confirm" && !game) renderPanel();
    }
  });
  function tickUI() {
    updateResourceHUD();
    const sig = JSON.stringify([
      state.floors.map((f) => [
        f.id,
        f.students,
        f.ready,
        E.floorState(state, f),
      ]),
      state.candidates.map((c) => c.id),
      state.candidateQueue?.map((c) => c.id),
      state.construction ? [state.construction.id, state.construction.left <= 0] : null,
      E.teacherList(state).map((t) => [t.id, !!t.training]),
      state.newbies.map((n) => n.id),
      state.competitions.length,
      !!state.joint,
      state.chapter,
      state.events?.unlocked,
      state.events?.completed,
      Math.ceil(state.events?.cooldown || 0) === 0,
    ]);
    if (sig !== lastSig) {
      lastSig = sig;
      syncPeople();
      if (
        selected !== null &&
        !game &&
        view !== "confirm" &&
        view !== "result" &&
        view !== "import-error" &&
        document.activeElement?.tagName !== "SELECT"
      )
        renderPanel();
    }
    if (selected !== null) {
      body
        .querySelectorAll("[data-count]")
        .forEach((el) => (el.textContent = num(state[el.dataset.count])));
      body
        .querySelectorAll("[data-lesson]")
        .forEach(
          (el) =>
            (el.textContent = clock(
              state.floors.find((f) => f.id === el.dataset.lesson)?.lesson || 0,
            )),
        );
      body
        .querySelectorAll("[data-training]")
        .forEach(
          (el) =>
            (el.textContent = clock(
              state.teachers[el.dataset.training]?.training?.left || 0,
            )),
        );
      body
        .querySelectorAll("[data-competition]")
        .forEach(
          (el) =>
            (el.textContent = clock(
              state.competitions.find((c) => c.floor === el.dataset.competition)
                ?.left || 0,
            )),
        );
      body
        .querySelectorAll("[data-joint]")
        .forEach((el) => (el.textContent = clock(state.joint?.left || 0)));
      body
        .querySelectorAll("[data-event-cooldown]")
        .forEach((el) => (el.textContent = clock(state.events?.cooldown || 0)));
      body
        .querySelectorAll("[data-event-button-time]")
        .forEach((el) => (el.textContent = clock(state.events?.cooldown || 0)));
      body
        .querySelectorAll("[data-construction-time]")
        .forEach((el) => (el.textContent = clock(state.construction?.left || 0)));
      body.querySelectorAll('[data-action="build"]').forEach((b) => {
        const first = state.floors.length === 0;
        b.disabled = first
          ? false
          : !!state.construction ||
            state.coins < E.floorCost(state) ||
            E.totalProjects(state) < E.lab(b.dataset.id).unlock;
      });
      body.querySelectorAll('[data-action="hire"]').forEach((b) => {
        const c = state.candidates.find((c) => c.id === b.dataset.id);
        b.disabled = !c || state.coins < c.cost;
      });
      body.querySelectorAll('[data-action="train"]').forEach((b) => {
        const teacher = state.teachers[b.dataset.id],
          f = state.floors.find((f) => f.teachers.includes(b.dataset.id));
        b.disabled =
          !teacher ||
          !!teacher.training ||
          !f ||
          teacher.skills[f.id] >= 10 ||
          state.knowledge < teacher.skills[f.id] * 30;
      });
      body.querySelectorAll('[data-action="upgrade"]').forEach((b) => {
        const f = state.floors.find((f) => f.id === b.dataset.floor),
          c = E.upgradeCost(f);
        b.disabled =
          f.level >= 3 ||
          f.ready ||
          f.lesson > 0 ||
          state.coins < c.coins ||
          state.knowledge < c.knowledge;
      });
    }
  }
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
    lastFrame = now;
    t += dt;
    if (!document.hidden) {
      if (!state.settings.paused && !game && !phasesBusy() && !blockedSave) {
        simAcc += dt * state.settings.speed;
        if (simAcc >= 0.2) {
          E.advance(state, simAcc);
          simAcc = 0;
        }
      } else {
        simAcc = 0;
      }
      cam += (targetCam - cam) * Math.min(1, dt * 12);
      if (Math.abs(targetCam - cam) < 0.05) cam = targetCam;
      makeLayouts();
      updateAdminShift(dt);
      updatePeople(dt);
      updateLift(dt);
      if (game?.kind === "event-block" && !game.done) {
        const left = Math.max(0, Math.ceil((game.deadline - Date.now()) / 1000));
        const timerEl = body.querySelector("[data-block-time]");
        if (timerEl) timerEl.textContent = String(left);
        if (Date.now() >= game.deadline)
          finishBlockEvent("Минута закончилась.");
      }
      if (game?.kind === "event-pulse" && !game.done) {
        const left = Math.max(0, Math.ceil((game.deadline - Date.now()) / 1000));
        const timerEl = body.querySelector("[data-pulse-time]");
        if (timerEl) timerEl.textContent = String(left);
        if (Date.now() >= game.deadline)
          finishPulseEvent("Время вышло — мероприятие завершено.");
      }
      positionUI();
      draw(dt);
      saveAcc += dt;
      uiAcc += dt;
      if (uiAcc > 0.75) {
        uiAcc = 0;
        tickUI();
      }
      if (saveAcc > 5) {
        saveAcc = 0;
        save();
      }
    }
    requestAnimationFrame(frame);
  }
  // Read-only inspection is useful when extending the game in a browser console.
  window.QuantumTower = Object.freeze({
    version: "6.0",
    inspect: () => JSON.parse(JSON.stringify(state)),
    get lift() {
      return {
        level: lift.level,
        target: lift.target,
        phase: lift.phase,
        passenger: lift.passenger ? { ...lift.passenger } : null,
      };
    },
    get selectedRoom() {
      return selected === null ? null : roomId(selected);
    },
  });
  resize();
  syncPeople();
  createHitboxes(true);
  positionUI();
  updateResourceHUD();
  save();
  if (saveError) tell(saveError, 0, true);
  else if (fresh)
    tell("Начните с крыши: первый квантум можно построить бесплатно.", 3);
  requestAnimationFrame(frame);
})();

</script>
  </body>
</html>
